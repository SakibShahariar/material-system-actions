name: Extension package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes glib2.0-bin zip unzip

      - name: Validate packaging script syntax
        run: bash -n scripts/package.sh

      - name: Test packaging preflight and checksum
        run: bash tests/test-package.sh

      - name: Validate JavaScript syntax
        run: |
          for file in extension.js prefs.js lib/*.js lib/layouts/*.js; do
            node --check "$file"
          done

      - name: Test action preference ordering and visibility
        run: node --test tests/*.test.mjs

      - name: Compile GSettings schema strictly
        run: glib-compile-schemas --strict schemas/

      - name: Build archive using a relative output directory
        run: ./scripts/package.sh build-output

      - name: Validate archive integrity and required files
        run: |
          archive="build-output/material-system-actions@sakib.dev.shell-extension.zip"
          unzip -t "$archive"
          test "$(basename "$archive")" = "material-system-actions@sakib.dev.shell-extension.zip"
          unzip -Z1 "$archive" | grep -Fx 'metadata.json'
          unzip -Z1 "$archive" | grep -Fx 'extension.js'
          unzip -Z1 "$archive" | grep -Fx 'prefs.js'
          unzip -Z1 "$archive" | grep -Fx 'stylesheet.css'
          unzip -Z1 "$archive" | grep -Fx 'schemas/gschemas.compiled'
          if unzip -Z1 "$archive" | grep -Eq '^(README.md|AGENTS.md|prototype/|tests/|\.github/|docs/|scripts/)'; then
            echo "Archive contains development-only files." >&2
            exit 1
          fi
          (cd build-output && sha256sum --check "$(basename "$archive").sha256")
